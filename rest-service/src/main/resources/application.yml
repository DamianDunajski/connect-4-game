spring:
  application:
    name: connect-4-game.api
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  structured:
    format:
      console: logstash