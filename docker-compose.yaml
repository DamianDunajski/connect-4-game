services:
  game-rest-service:
    image: rest-service:1.0.0-SNAPSHOT
    ports:
      - "8080:8080"
    environment:
      STORAGE_SERVICE_ENDPOINT: "http://game-storage-service:8070"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
    labels:
      logging: "alloy"
      app: "connect4game.rest-service"
  game-storage-service:
    image: storage-service:1.0.0-SNAPSHOT
    ports:
      - "8070:8070"
    environment:
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
    labels:
      logging: "alloy"
      app: "connect4game.storage-service"
  alloy:
    image: grafana/alloy:v1.20.1
    ports:
      - "12345:12345"
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - game-rest-service
      - game-storage-service
      - loki
      - mimir
      - tempo
  loki:
    image: grafana/loki:3.7.8
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
  mimir:
    image: grafana/mimir:3.2.2
    ports:
      - "9009:9009"
    command: [ "-config.file=/etc/mimir/mimir.yaml" ]
    volumes:
      - ./docker/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_data:/data/mimir
  tempo:
    image: grafana/tempo:3.1.0
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # tempo HTTP query
      - "4317:4317" # OTLP GRPC
      - "4318:4318" # OTLP HTTP
  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - loki
      - mimir
      - tempo

volumes:
  mimir_data:
  tempo_data: